  <!-- Borda neon -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#00ffcc" stroke-width="16" stroke-opacity="0.5"/>

  <!-- Letra P -->
  <path d="M 160 140 L 260 140 C 310 140 330 170 330 210 C 330 250 310 280 260 280 L 200 280 L 200 370" fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  
